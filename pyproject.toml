[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pxil"
version = "0.1.0"
description = "Read and write pxil files: one sequence as a picture, one pixel per residue"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Chronomic Medicine Group, Department of Genomic Medicine, University of Cambridge" }]
keywords = ["genomics", "sequence", "protein", "png", "image", "pxil", "gpxil"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["Pillow>=9.1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/comparativechrono/pxil"
"Gpxil browser" = "https://comparativechrono.github.io/Gpxil-browser/"

[tool.setuptools]
py-modules = ["pxil"]
